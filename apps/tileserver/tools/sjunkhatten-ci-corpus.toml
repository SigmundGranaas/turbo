# Sjunkhatten CI corpus — the subset the committed pack covers.
#
# Generated by tools/make_ci_corpus.py: the densest cluster of hikes
# in the full corpus, so the pack covering them is small enough to
# live in git and the routing gate can run on every push.
#
# This corpus keeps its OWN baseline (tools/sjunkhatten-ci-baseline.json).
# Since D8 was fixed the sliced pack reports exactly the same terrain
# as its source, and these hashes currently match the full artifacts'
# on both lanes — but that is a property of a generous halo (slicing
# still drops trail edges at the boundary), not a guarantee. Treat it
# as a self-consistent gate and do not assume the numbers stay equal.
#
# 25 hikes, 33.1 km, buckets: {'sjunkhatten-short': 9, 'sjunkhatten-mid': 11, 'sjunkhatten-long': 5}.

